services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6500:6379"

  processor:
    build: ./processor
    volumes:
      - ./processor:/app
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      processor:
        condition: service_healthy
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:4700:4000"

  # Same image as the API. In development the API container compiles the code into ./api/dist
  # (nest start --watch); the worker waits for dist/worker.js and runs it.
  # After changing worker code run: docker compose restart worker
  worker:
    build: ./api
    env_file: .env
    command: ["sh", "-c", "while [ ! -f dist/worker.js ]; do sleep 2; done; exec node dist/worker.js"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      processor:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  pgdata:
  redisdata:
  api_node_modules:
  uploads: